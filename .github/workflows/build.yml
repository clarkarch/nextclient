name: build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # weekly sanity build

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.7"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            build: linux
            path: build/linux/x64/release/bundle
          - name: windows
            os: windows-latest
            build: windows
            path: build/windows/x64/runner/Release
          - name: macos
            os: macos-latest
            build: macos
            path: build/macos/Build/Products/Release
          # NOTE: 'web' is intentionally not in the matrix for now — the app
          # is desktop-centric (dart:ffi/GStreamer/libwebrtc/pointer_lock/
          # window_manager) and `dart:ffi` is unavailable on web, so it cannot
          # compile. Re-add once a web-safe path (conditional imports) exists.
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: matrix.build == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build
        run: flutter build ${{ matrix.build }} --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-client-${{ matrix.name }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: next-android
          path: build/app/outputs/flutter-apk/*.apk